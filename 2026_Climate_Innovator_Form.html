<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>氣候引領者證書申請表 | Application for Climate Innovator Certificate</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #eef3ec;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .form-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        /* 顶部图片样式 */
        .top-banner {
            text-align: center;
            margin-bottom: 20px;
        }
        .top-banner img {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            display: block;
            margin: 0 auto;
        }
        /* 标题样式 */
        h1 {
            font-size: 1.5rem;
            color: #1c6a41;
            border-left: 5px solid #6fbf4c;
            padding-left: 14px;
            margin-bottom: 8px;
            line-height: 1.3;
            word-break: break-word;
        }
        .title-main {
            display: block;
        }
        .title-en {
            display: block;
            font-size: 0.9rem;
            font-weight: normal;
            color: #457b5e;
            margin-top: 6px;
        }
        .field-group {
            margin-bottom: 18px;
        }
        .field-label {
            font-weight: 600;
            color: #2a5e3f;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .required:after {
            content: " *";
            color: #d44c2f;
        }
        /* 选填标记样式 */
        .optional {
            font-weight: normal;
            font-size: 0.7rem;
            color: #6f8f66;
            margin-left: 6px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbdcc2;
            border-radius: 20px;
            font-size: 0.9rem;
            background: #fffdf8;
        }
        .name-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .name-row input {
            flex: 1;
        }
        /* 项目选项样式（复选框统一大小） */
        .projects-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f8fcf5;
            border: 1px solid #cde0c0;
            border-radius: 48px;
            padding: 12px 18px;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
        }
        .option-btn input[type="checkbox"] {
            width: 24px;
            height: 24px;
            min-width: 24px;
            min-height: 24px;
            margin: 0;
            flex-shrink: 0;
            accent-color: #2c7a4d;
            cursor: pointer;
        }
        .option-text {
            flex: 1;
            font-size: 0.9rem;
            line-height: 1.3;
            color: #2a5e3f;
            word-break: break-word;
        }
        /* 多行选项样式 - 两行字体大小相同 */
        .option-text-equal {
            flex: 1;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #2a5e3f;
        }
        .option-text-equal .line1 {
            display: block;
        }
        .option-text-equal .line2 {
            display: block;
            font-size: 0.9rem;
            color: #2a5e3f;
            margin-top: 2px;
        }
        @media (max-width: 600px) {
            .option-btn input[type="checkbox"] {
                width: 26px;
                height: 26px;
                min-width: 26px;
                min-height: 26px;
            }
            .option-btn {
                padding: 12px 16px;
            }
        }
        .conditional-area {
            background: #f9fcf5;
            border-left: 4px solid #6fbf4c;
            padding: 15px;
            margin-top: 15px;
            border-radius: 20px;
        }
        .btn-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        button {
            background: #2c7a4d;
            color: white;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 48px;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
        }
        .preview-card {
            background: #f9fff7;
            border-radius: 24px;
            margin-top: 25px;
            padding: 16px;
            border: 1px solid #c7e0b8;
        }
        .preview-line {
            padding: 6px 0;
            border-bottom: 1px solid #e2f0da;
        }
        .image-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 12px;
            margin-right: 8px;
            margin-top: 8px;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .work-check-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .work-check-group label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8fcf5;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #deecce;
            cursor: pointer;
        }
        .work-check-group input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin: 0;
            accent-color: #2c7a4d;
        }
        /* 图床选择提示框 - 已移至底部，字体缩小10% */
        .storage-selector {
            background: #fff7e0;
            border-radius: 20px;
            padding: 10px 14px;
            margin-top: 14px;
            margin-bottom: 6px;
            border: 1px solid #ffda99;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.81rem;
        }
        .storage-selector label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
            color: #c26b2e;
            font-size: 0.81rem;
        }
        .storage-selector input {
            width: 18px;
            height: 18px;
            accent-color: #2c7a4d;
        }
        .storage-hint {
            font-size: 0.68rem;
            color: #c26b2e;
            background: rgba(255,245,200,0.6);
            padding: 3px 8px;
            border-radius: 30px;
        }
        .current-storage-status {
            font-size: 0.75rem;
            margin-bottom: 8px;
        }
        .status-badge {
            background: #f0f6ea;
            padding: 4px 12px;
            border-radius: 30px;
            color: #2a5e3f;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <!-- 页面顶部图片 - 使用蜜蜂图床链接（保持不变） -->
    <div class="top-banner">
        <img src="https://bee-reg-ab.imagency.cn/e/62f05aa2a4eb516a18a7922303ae2290.png" alt="活動橫幅 - 中銀香港 × 朗晴慈善 碳中和行動" style="max-width:100%; height:auto; display:block; margin:0 auto;">
    </div>

    <h1>
        <span class="title-main">氣候引領者證書申請表</span>
        <span class="title-main">(截止日期 6月22日)</span>
        <span class="title-en">Application for Climate Innovator Certificate</span>
    </h1>

    <!-- 姓名（原“中文姓名”，已刪除“中文”二字） -->
    <div class="field-group">
        <div class="field-label required">姓名</div>
        <div class="name-row">
            <input type="text" id="chineseSurname" placeholder="姓氏 / Surname" style="flex:1">
            <input type="text" id="chineseGivenName" placeholder="名字 / Given Name" style="flex:1">
        </div>
    </div>

    <!-- 職業 -->
    <div class="field-group">
        <div class="field-label required">職業</div>
        <select id="occupation">
            <option value="">請選擇</option>
            <option>學生</option><option>老師</option><option>社區領袖</option>
        </select>
    </div>

    <!-- 服務機構 -->
    <div class="field-group">
        <div class="field-label required">服務機構</div>
        <select id="organization">
            <option value="">請選擇</option>
            <option>學校</option><option>社區團體</option>
        </select>
    </div>

    <!-- 聯絡電郵 -->
    <div class="field-group">
        <div class="field-label required">聯絡電郵</div>
        <input type="email" id="email" placeholder="example@domain.com">
    </div>

    <!-- 聯絡電話 -->
    <div class="field-group">
        <div class="field-label required">聯絡電話</div>
        <div style="display:flex; gap:8px;">
            <select id="phoneCode" style="width:110px;"><option>+852</option><option>+853</option><option>+86</option></select>
            <input type="tel" id="phoneNumber" placeholder="數字">
        </div>
    </div>

    <!-- 參加項目（可多選）-->
    <div class="field-group">
        <div class="field-label required">參加項目 (可多選)</div>
        <div class="projects-container" id="projectList">
            <label class="option-btn"><input type="checkbox" value="4月29日大灣區交流及講座活動"><span class="option-text">4月29日大灣區交流及講座活動</span></label>
            
            <label class="option-btn">
                <input type="checkbox" value="5月9日或5月16日小學碳中和定向研習日營">
                <span class="option-text-equal">
                    <span class="line1">5月9日或5月16日</span>
                    <span class="line2">小學碳中和定向研習日營</span>
                </span>
            </label>
            
            <label class="option-btn">
                <input type="checkbox" value="6月14日世界環境日 碳中和教育站活動">
                <span class="option-text-equal">
                    <span class="line1">6月14日世界環境日</span> 
                    <span class="line2">碳中和教育站活動</span>
                </span>
            </label>

            <label class="option-btn"><input type="checkbox" value="6月6日世界環境日活動簡報會"><span class="option-text">6月6日世界環境日活動簡報會</span></label>
            
            <label class="option-btn">
                <input type="checkbox" value="Stanford - HKUST Global Sustainability Challenge">
                <span class="option-text-equal">
                    <span class="line1">Stanford - HKUST Global</span>
                    <span class="line2">Sustainability Challenge</span>
                </span>
            </label>
            
            <label class="option-btn">
                <input type="checkbox" id="essayCompetitionCheckbox" value="曾安排或組織學生參加「邁向碳中和 說好綠色故事」徵集比賽">
                <span class="option-text">曾安排或組織學生參加「邁向碳中和 說好綠色故事」徵集比賽</span>
            </label>
            
            <label class="option-btn" id="otherLabel">
                <input type="checkbox" id="otherCheckbox" value="組織其他環保宣傳活動">
                <span class="option-text">組織其他環保宣傳活動</span>
            </label>
        </div>
    </div>

    <!-- 條件區域：只有勾選「組織其他環保宣傳活動」才顯示 -->
    <div id="conditionalBlock" class="conditional-area" style="display: none;">
        <div class="field-group"><div class="field-label required">請填寫項目名稱</div><input type="text" id="projectName" placeholder="具體活動名稱"></div>
        <div class="field-group"><div class="field-label required">學校或社區團體名稱</div><input type="text" id="groupName" placeholder="請輸入"></div>
        <div class="field-group"><div class="field-label required">您的工作對象 (可多選)</div>
            <div class="work-check-group"><label><input type="checkbox" value="學生"> 學生</label><label><input type="checkbox" value="社區"> 社區</label><label><input type="checkbox" value="制服團體"> 制服團體</label></div>
        </div>
    </div>

    <!-- 上傳環保活動相片 區域 -->
    <div class="field-group">
        <div class="field-label">上傳環保活動相片 (選填)</div>
        <div class="current-storage-status"><span class="status-badge" id="storageBadge">☁️ 目前使用：Google Drive (預設)</span></div>
        
        <!-- 文件选择按钮和提示 -->
        <input type="file" id="photoUpload" multiple accept="image/jpeg,image/png">
        <div class="file-info" style="font-size:0.7rem; color:#6b8c5c; margin-top:5px;">支持 JPG/PNG，單張最大10MB，最多4張</div>
        <div id="filePreview" style="font-size:0.7rem; color:#6b8c5c; margin-top:5px;"></div>
        <div id="imageThumbnails" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;"></div>
        
        <!-- 大湾区报名者选项 -->
        <div class="storage-selector">
            <label>
                <input type="checkbox" id="useBeeImgCheckbox">
                <span>若為大灣區報名者，請使用此項上載相片。</span>
            </label>
            <span class="storage-hint">(勾選後將使用蜜蜂圖床，否則使用 Google Drive)</span>
        </div>
    </div>

    <!-- ========= 傳播貢獻 - 已改為選填 ========= -->
    <div class="field-group">
        <div class="field-label">傳播氣候變化或碳中和環保訊息方面所做的貢獻 <span class="optional">(選填)</span></div>
        <textarea id="contribution" rows="3" placeholder="請簡單描述... (非必填)"></textarea>
    </div>

    <div class="field-group">
        <div style="font-size:0.75rem;">如有任何疑問，請發送電子郵件至 info@langqingcharity.hk</div>
    </div>

    <!-- 按鈕區域 -->
    <div class="btn-row">
        <button type="button" id="submitBtn">✅ 提交申請</button>
    </div>

    <div id="previewArea" style="margin-top: 25px;"></div>
    <div id="statusMsg" style="text-align:center; margin-top:10px; color:#2a7a4a;"></div>
</div>

<script>
    // ==================== 配置區 ====================
    // 请替换为您的 Google Apps Script 网路应用程式网址
    const GAS_UPLOAD_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';
    // 蜜蜂圖床 API (备用)
    const BEEIMG_API = 'https://www.beeimg.cn/api/upload';
    const BEEIMG_TOKEN = 'YOUR_BEEIMG_TOKEN_HERE';
    
    let selectedFiles = [];
    const useBeeImgCheckbox = document.getElementById('useBeeImgCheckbox');
    const storageBadge = document.getElementById('storageBadge');
    
    function updateStorageStatus() {
        if (useBeeImgCheckbox.checked) {
            storageBadge.innerHTML = '📸 目前使用：蜜蜂圖床 (適用於大灣區報名者)';
        } else {
            storageBadge.innerHTML = '☁️ 目前使用：Google Drive (預設)';
        }
    }
    useBeeImgCheckbox.addEventListener('change', updateStorageStatus);
    updateStorageStatus();
    
    // 图片预览与限制 (仅 JPG/PNG)
    const fileInput = document.getElementById('photoUpload');
    const thumbnailsDiv = document.getElementById('imageThumbnails');
    const filePreviewSpan = document.getElementById('filePreview');
    fileInput.addEventListener('change', () => {
        const files = Array.from(fileInput.files);
        const allowedTypes = ['image/jpeg', 'image/png'];
        if (files.some(f => !allowedTypes.includes(f.type))) {
            alert('只支援 JPG 和 PNG 格式的圖片');
            fileInput.value = '';
            selectedFiles = [];
            thumbnailsDiv.innerHTML = '';
            filePreviewSpan.innerText = '';
            return;
        }
        if (files.length > 4) { alert('最多上傳4張圖片'); fileInput.value = ''; selectedFiles = []; thumbnailsDiv.innerHTML = ''; filePreviewSpan.innerText = ''; return; }
        let totalSize = files.reduce((s, f) => s + f.size, 0);
        if (totalSize > 20 * 1024 * 1024) { alert('總檔案大小超過20MB'); fileInput.value = ''; selectedFiles = []; thumbnailsDiv.innerHTML = ''; filePreviewSpan.innerText = ''; return; }
        selectedFiles = files;
        filePreviewSpan.innerText = `已選擇 ${files.length} 張圖片`;
        thumbnailsDiv.innerHTML = '';
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = document.createElement('img');
                img.src = ev.target.result;
                img.classList.add('image-thumb');
                thumbnailsDiv.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });
    
    // Google Drive 上传 (支持重命名)
    async function uploadToGoogleDrive(file, submissionId, chineseName) {
        if (GAS_UPLOAD_URL.includes('YOUR_DEPLOYMENT_ID')) throw new Error('请先设定 Google Apps Script 网路应用程式网址');
        const base64Data = await new Promise(r => { const reader = new FileReader(); reader.onload = () => r(reader.result); reader.readAsDataURL(file); });
        const formData = new FormData();
        formData.append('file', base64Data);
        formData.append('fileName', file.name);
        formData.append('submissionId', submissionId);
        formData.append('chineseName', chineseName);
        const response = await fetch(GAS_UPLOAD_URL, { method: 'POST', body: formData });
        const result = await response.json();
        if (result.success) return result.fileUrl;
        else throw new Error(result.message || 'Google Drive 上傳失敗');
    }
    
    async function uploadToBeeIMG(file) {
        if (BEEIMG_TOKEN === 'YOUR_BEEIMG_TOKEN_HERE') throw new Error('请设定蜜蜂图床 Token');
        const formData = new FormData();
        formData.append('token', BEEIMG_TOKEN);
        formData.append('file', file);
        const response = await fetch(BEEIMG_API, { method: 'POST', body: formData });
        const result = await response.json();
        if (result.code === 200 && result.data?.url) return result.data.url;
        else throw new Error(result.msg || '蜜蜂圖床上傳失敗');
    }
    
    async function batchUploadImages(files, useBeeImg, submissionId, chineseName) {
        const urls = [];
        for (let i = 0; i < files.length; i++) {
            document.getElementById('statusMsg').innerText = `📸 上傳圖片 ${i+1}/${files.length}...`;
            const url = useBeeImg ? await uploadToBeeIMG(files[i]) : await uploadToGoogleDrive(files[i], submissionId, chineseName);
            urls.push(url);
        }
        return urls;
    }
    
    // ========== 表單邏輯 ==========
    const otherCheckbox = document.getElementById('otherCheckbox');
    const conditionalBlock = document.getElementById('conditionalBlock');
    function toggleConditional() {
        conditionalBlock.style.display = (otherCheckbox && otherCheckbox.checked) ? 'block' : 'none';
    }
    if (otherCheckbox) {
        otherCheckbox.addEventListener('change', toggleConditional);
        otherCheckbox.closest('.option-btn')?.addEventListener('click', () => setTimeout(toggleConditional, 10));
    }
    toggleConditional();
    
    function getSelectedProjects() {
        return Array.from(document.querySelectorAll('#projectList input[type="checkbox"]:checked')).map(cb => cb.value);
    }
    function getWorkTargets() {
        return Array.from(document.querySelectorAll('#conditionalBlock .work-check-group input[type="checkbox"]:checked')).map(cb => cb.value);
    }
    
    function collectData() {
        const chineseSurname = document.getElementById('chineseSurname').value.trim();
        const chineseGiven = document.getElementById('chineseGivenName').value.trim();
        const chineseName = chineseSurname + chineseGiven;
        const basic = {
            chineseName, chineseSurname, chineseGivenName: chineseGiven,
            occupation: document.getElementById('occupation').value,
            organization: document.getElementById('organization').value,
            email: document.getElementById('email').value.trim(),
            phoneCode: document.getElementById('phoneCode').value,
            phoneNumber: document.getElementById('phoneNumber').value.trim(),
            projects: getSelectedProjects(),
            contribution: document.getElementById('contribution').value.trim()  // 选填，允许为空
        };
        let conditional = { projectName: '', groupName: '', workTargets: [] };
        if (basic.projects.includes('組織其他環保宣傳活動')) {
            conditional.projectName = document.getElementById('projectName')?.value.trim() || '';
            conditional.groupName = document.getElementById('groupName')?.value.trim() || '';
            conditional.workTargets = getWorkTargets();
        }
        return { basic, conditional, fileNames: selectedFiles.map(f => f.name) };
    }
    
    function validate(basic, conditional) {
        if (!basic.chineseName) return "請填姓名";
        if (!basic.occupation) return "請選擇職業";
        if (!basic.organization) return "請選擇服務機構";
        if (!basic.email) return "請填電郵";
        if (!basic.phoneNumber) return "請填電話";
        if (basic.projects.length === 0) return "請至少選擇一個參加項目";
        if (basic.projects.includes('組織其他環保宣傳活動')) {
            if (!conditional.projectName) return "請填寫項目名稱";
            if (!conditional.groupName) return "請填寫學校/團體名稱";
            if (conditional.workTargets.length === 0) return "請至少選擇一個工作對象";
        }
        // 傳播貢獻已改為選填，不再驗證
        return null;
    }
    
    function generateId() { return 'CI-' + Math.floor(Math.random() * 90000 + 10000); }
    
    function renderPreview(data, submissionId, imageUrls, isAfterConfirm = false) {
        const previewDiv = document.getElementById('previewArea');
        const normalProjects = data.basic.projects.filter(p => p !== '組織其他環保宣傳活動');
        let otherHtml = '';
        if (data.basic.projects.includes('組織其他環保宣傳活動')) {
            otherHtml = `<div style="background:#eef6e6; padding:12px; border-radius:16px; margin-top:8px;"><strong>📌 組織其他環保宣傳活動</strong><br>項目名稱: ${escapeHtml(data.conditional.projectName || '—')}<br>學校/團體: ${escapeHtml(data.conditional.groupName || '—')}<br>工作對象: ${escapeHtml(data.conditional.workTargets.join(', ') || '—')}</div>`;
        }
        let imageHtml = '';
        if (imageUrls?.length) imageHtml = `<div class="preview-line"><strong>上傳圖片:</strong> ${imageUrls.map(url => `<a href="${escapeHtml(url)}" target="_blank">查看圖片</a>`).join(' | ')}</div>`;
        // 顯示傳播貢獻（可為空）
        const contributionDisplay = data.basic.contribution ? escapeHtml(data.basic.contribution) : '(未填寫)';
        previewDiv.innerHTML = `<div class="preview-card"><div class="preview-header"><strong>📋 申請預覽 | 編號: ${submissionId}</strong></div><div class="preview-line"><strong>姓名:</strong> ${escapeHtml(data.basic.chineseName)}</div><div class="preview-line"><strong>職業/機構:</strong> ${escapeHtml(data.basic.occupation)} / ${escapeHtml(data.basic.organization)}</div><div class="preview-line"><strong>電郵/電話:</strong> ${escapeHtml(data.basic.email)} / ${escapeHtml(data.basic.phoneCode)} ${escapeHtml(data.basic.phoneNumber)}</div><div class="preview-line"><strong>參加項目:</strong> ${escapeHtml(normalProjects.join('；') || '無')}</div>${otherHtml}<div class="preview-line"><strong>傳播貢獻:</strong><br>${contributionDisplay}</div>${imageHtml}</div>${!isAfterConfirm ? `<div style="display:flex; gap:12px; justify-content:flex-end; margin-top:15px;"><button id="modifyBtn" style="background:#e4ecd9; color:#2a5a3a;">✏️ 修改</button><button id="confirmBtn" style="background:#1f6e44;">✅ 確認提交</button></div>` : `<div style="margin-top:15px; background:#e0f0da; padding:12px; border-radius:24px; text-align:center;">✅ 已確認提交！</div>`}`;
        if (!isAfterConfirm) {
            document.getElementById('modifyBtn')?.addEventListener('click', () => { previewDiv.innerHTML = ''; window.scrollTo(0,0); });
            document.getElementById('confirmBtn')?.addEventListener('click', () => { alert('模擬提交完成'); renderPreview(data, submissionId, imageUrls, true); });
        }
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]); }
    
    let isSubmitting = false;
    document.getElementById('submitBtn').addEventListener('click', async () => {
        if (isSubmitting) return;
        isSubmitting = true;
        const btn = document.getElementById('submitBtn');
        const originalText = btn.innerText;
        btn.innerText = '⏳ 處理中...';
        btn.disabled = true;
        try {
            const { basic, conditional, fileNames } = collectData();
            const err = validate(basic, conditional);
            if (err) { alert('❌ ' + err); return; }
            let uploadedUrls = [];
            if (selectedFiles.length) {
                const useBeeImg = useBeeImgCheckbox.checked;
                const newId = generateId();
                document.getElementById('statusMsg').innerHTML = useBeeImg ? '📸 使用蜜蜂圖床上傳...' : '☁️ 使用 Google Drive 上傳...';
                uploadedUrls = await batchUploadImages(selectedFiles, useBeeImg, newId, basic.chineseName);
                renderPreview({ basic, conditional, fileNames }, newId, uploadedUrls, false);
                document.getElementById('previewArea').scrollIntoView({ behavior: 'smooth' });
                document.getElementById('statusMsg').innerHTML = `⏳ 編號 ${newId}，請確認後提交。`;
            } else {
                const newId = generateId();
                renderPreview({ basic, conditional, fileNames }, newId, [], false);
            }
        } catch (error) { alert('上傳失敗: ' + error.message); } 
        finally { isSubmitting = false; btn.innerText = originalText; btn.disabled = false; }
    });
</script>
</body>
</html>
