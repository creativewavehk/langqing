<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氣候引領者報名表格</title>
    <style>
        /* 讓畫面全高，方便內容垂直置中 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 文字容器：寬度設定為網頁的 3/5 (即 60%) */
        .content-container {
            width: 60%; 
            text-align: center;
            word-break: break-all;
        }

        /* H2 尺寸放大 */
        h2 {
            font-size: 3.5rem; /* 放大字體 */
            color: #2e7d32;    /* 氣候主題綠色 */
            margin: 0 0 20px 0;
            letter-spacing: 2px;
        }

        /* 網頁維護中提示字 */
        .maintenance-notice {
            font-size: 1.8rem; /* 放大字體 */
            color: #666;
            margin: 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="content-container">
        <h2>氣候引領者報名表格</h2>
        <div class="maintenance-notice">(網頁維護中…)</div>
    </div>

</body>
</html>
